<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报价版式示例</title><style>
    :root{--ink:#272018;--muted:#71675a;--red:#b83826;--red-dark:#85271d;--orange:#e7a65d;--cream:#faf5ec;--paper:#fffdf8;--line:#eadfcd;--soft:#f5ead9}
    *{box-sizing:border-box}
    html{background:#e9e3d8;-webkit-text-size-adjust:100%}
    body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
    .page{width:min(100%,760px);margin:0 auto;background:var(--paper);overflow:hidden;box-shadow:0 24px 70px #3c2a181c}
    .hero{position:relative;padding:52px 46px 43px;color:#fff9ec;background:linear-gradient(130deg,#79251e 0%,#a63224 52%,#c4482b 100%);overflow:hidden}
    .hero:before,.hero:after{content:"";position:absolute;border:1px solid #fff4d929;border-radius:50%;pointer-events:none}
    .hero:before{width:360px;height:360px;right:-145px;top:-150px}.hero:after{width:235px;height:235px;right:-40px;top:28px}
    .eyebrow{position:relative;z-index:1;display:inline-block;padding:5px 12px;border:1px solid #f9e1c590;border-radius:100px;font-size:12px;letter-spacing:.18em;color:#ffe7c8}
    h1{position:relative;z-index:1;margin:22px 0 10px;font-size:40px;line-height:1.22;letter-spacing:.015em;font-weight:800}
    .hero p{position:relative;z-index:1;margin:0;color:#ffe6d5;font-size:16px}
    .hero-rule{width:48px;height:3px;background:#ffcf83;margin:25px 0 21px}
    .hero-summary{max-width:545px;font-size:17px!important;line-height:1.8}
    main{padding:0 46px 48px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-22px 0 44px;position:relative;z-index:2}
    .metric{min-height:112px;padding:18px 12px;background:#fffdf8;border:1px solid #f1dfca;border-radius:13px;text-align:center;box-shadow:0 8px 22px #643c1910}
    .metric strong{display:block;color:var(--red);font-size:30px;line-height:1.2;letter-spacing:-.035em}.metric small{font-size:13px;font-weight:700}.metric span{display:block;margin-top:7px;font-size:12px;color:var(--muted)}
    section{margin-top:42px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.num{font-size:12px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--red);border-radius:6px;padding:4px 8px}.section-head h2{margin:0;font-size:23px;line-height:1.3;letter-spacing:.01em}
    p{margin:0 0 12px}.lead{font-size:16px;line-height:1.85}.muted{color:var(--muted)}
    .insight{border-left:4px solid var(--red);padding:14px 18px;background:#fbf1e9;border-radius:0 10px 10px 0;font-weight:650}
    .strategy{display:grid;grid-template-columns:1fr 1fr;gap:12px}.strategy-card{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--paper)}.strategy-card b{display:block;color:var(--red-dark);font-size:18px;margin-bottom:8px}.strategy-card p{margin:0;color:#5b5146;font-size:14px}
    .flow{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;padding:11px;background:var(--soft);border-radius:8px;color:#694a33;font-size:13px;font-weight:650;text-align:center}.flow i{font-style:normal;color:var(--red);font-size:17px}
    .budget{border:1px solid var(--line);border-radius:13px;overflow:hidden}.budget-head,.budget-row{display:grid;grid-template-columns:2fr .95fr 1fr 1fr;align-items:center;gap:6px;padding:12px 15px}.budget-head{background:#f1e6d6;color:#6c5342;font-size:12px;font-weight:750}.budget-row{border-top:1px solid var(--line);font-size:14px}.budget-row:nth-child(odd){background:#fffaf1}.budget-row .item{font-weight:650}.budget-row .amount{text-align:right;font-weight:750}.budget-row span:not(.item):not(.amount){color:#685d50}.budget-total{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px;background:var(--red-dark);color:#fff;font-weight:750}.budget-total strong{font-size:25px;white-space:nowrap}
    .note{margin-top:10px;color:var(--muted);font-size:12px}
    .tag-grid{display:flex;flex-wrap:wrap;gap:9px}.tag{padding:8px 13px;border:1px solid #e5d6c1;background:#fff8eb;border-radius:99px;color:#5a4534;font-size:13px;font-weight:650}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plain-card{border-radius:11px;background:#f8f1e7;padding:19px}.plain-card h3{margin:0 0 8px;color:var(--red-dark);font-size:17px}.plain-card p{margin:0;color:#5f554a;font-size:14px}.plain-card .count{display:block;font-size:27px;font-weight:800;color:var(--red);line-height:1.2;margin-bottom:7px}
    .template-intro{margin-bottom:17px;color:#5d5145;font-size:14px}.template-list{display:grid;gap:14px}.template-card{display:grid;grid-template-columns:180px 1fr;gap:19px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:13px;background:#fffaf3}.mockup{aspect-ratio:3/4;width:100%;border-radius:8px;overflow:hidden;box-shadow:0 5px 16px #5c311e22;display:flex;flex-direction:column;padding:10px;position:relative}.mockup .mini-label{font-size:8px;font-weight:800;letter-spacing:.12em}.mockup .mini-title{font-size:17px;line-height:1.22;font-weight:900;margin:5px 0 7px;letter-spacing:-.03em}.mockup .mini-sub{font-size:8px;line-height:1.35;font-weight:700}.mockup .photo{display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:700;line-height:1.35;letter-spacing:.04em;color:#614735;background:linear-gradient(145deg,#e5caa8,#b98160);border:1px solid #ffffffa3;border-radius:4px}.mockup .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:1;min-height:0;margin-top:7px}.mockup .photo-grid .photo:first-child{grid-column:1/3}.mockup.food{background:#f7e7c7;color:#772d20}.mockup.food .mini-title{font-size:18px}.mockup.food .photo{background:linear-gradient(150deg,#d7aa70,#8c5039);color:#fff9ee}.mockup.question{background:#e8efdd;color:#30402a}.mockup.question .photo{height:45%;margin-top:auto;background:linear-gradient(135deg,#c1d0b4,#8ba174);color:#2e4531}.mockup.question .mini-title{font-size:20px;margin-top:14px}.mockup.category{background:#f6dfd3;color:#852d24}.mockup.category .photo{height:43%;margin-top:9px;background:linear-gradient(140deg,#e1ab83,#9c4b38);color:#fff9ef}.mockup.category .mini-title{font-size:19px;margin-top:11px}.mockup .bottom-chip{margin-top:6px;align-self:flex-start;padding:2px 5px;background:#ffffffb0;border-radius:3px;font-size:7px;font-weight:800}.template-copy h3{margin:0 0 5px;font-size:17px;color:var(--red-dark)}.template-copy .type{display:inline-block;font-size:11px;color:#8f6245;background:#f4e6d5;padding:3px 7px;border-radius:5px;margin-bottom:8px}.template-copy p{font-size:13px;line-height:1.7;margin:0 0 7px;color:#5e5347}.template-copy p:last-child{margin-bottom:0}.template-copy b{color:#433024}.template-note{margin-top:13px;padding:11px 13px;background:#f8f1e7;border-radius:8px;color:#705f50;font-size:12px}
    .reference-shot{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 5px 16px #5c311e22;cursor:zoom-in}.reference-wrap{position:relative}.reference-badge{position:absolute;left:7px;top:7px;background:#aa3428;color:white;border-radius:4px;padding:3px 6px;font-size:10px;font-weight:800;box-shadow:0 1px 4px #3e201e55;pointer-events:none}.image-viewer{position:fixed;inset:0;z-index:20;background:#1d1815ed;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}.image-viewer.open{display:flex}.image-viewer img{max-width:100%;max-height:95vh;object-fit:contain;border-radius:8px}.image-viewer span{position:absolute;right:18px;top:10px;color:white;font-size:28px}
    .scene-list{display:grid;gap:10px}.scene{display:grid;grid-template-columns:108px 1fr;gap:12px;align-items:start;padding:14px 16px;background:#fbf6ee;border:1px solid #eee1cf;border-radius:10px}.scene b{color:var(--red-dark);font-size:14px}.scene span{color:#5c5146;font-size:14px}
    .steps{counter-reset:step;display:grid;gap:0}.step{position:relative;display:grid;grid-template-columns:34px 1fr;gap:13px;padding-bottom:19px}.step:not(:last-child):before{content:"";position:absolute;left:15px;top:33px;bottom:0;width:1px;background:#e4cfb5}.step:before{}.step-index{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--red);color:white;font-size:13px;font-weight:800}.step b{display:block;font-size:15px;margin:2px 0 3px}.step p{margin:0;color:var(--muted);font-size:13px}
    .goal{background:#35271f;color:#fff8ee;padding:27px;border-radius:13px}.goal h3{font-size:21px;margin:0 0 10px}.goal p{margin:0;color:#eedfce;font-size:15px}.goal strong{color:#ffcb83}
    .delivery{display:grid;grid-template-columns:1fr 1fr;gap:10px}.delivery div{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fffaf1}.delivery strong{display:block;color:var(--red);font-size:25px;line-height:1.2}.delivery span{font-size:13px;color:#64594d}
    .closing{margin-top:24px;padding-top:21px;border-top:1px solid var(--line);font-size:13px;color:#78695a}.footer{margin-top:46px;padding:17px 46px 24px;background:#f3eadc;color:#8a7767;font-size:11px;text-align:center;letter-spacing:.06em}
    @media(max-width:600px){.hero{padding:40px 24px 38px}h1{font-size:33px}main{padding:0 20px 38px}.metrics{gap:6px;margin-bottom:35px}.metric{min-height:100px;padding:16px 6px}.metric strong{font-size:24px}.metric small{font-size:11px}.metric span{font-size:11px}.section-head h2{font-size:21px}section{margin-top:36px}.strategy,.two-col{grid-template-columns:1fr}.template-card{grid-template-columns:38% 1fr;gap:12px;padding:12px}.template-copy h3{font-size:15px}.template-copy p{font-size:12px}.mockup .mini-title{font-size:14px!important}.mockup.question .mini-title,.mockup.category .mini-title{margin-top:7px}.budget-head,.budget-row{grid-template-columns:1.6fr .68fr .9fr .9fr;padding:11px 8px;gap:2px;font-size:11px}.budget-head{font-size:10px}.budget-row .item{line-height:1.45}.scene{grid-template-columns:86px 1fr;gap:8px;padding:13px}.flow{font-size:11px;gap:5px}.footer{padding:17px 20px 24px}}
    @media print{html{background:white}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}.page{box-shadow:none;width:760px}.hero,.metric,.strategy-card,.plain-card,.scene,.goal,.delivery div{break-inside:avoid}section{break-inside:avoid}}
  </style><body><main class="page"><header class="hero"><h1>品牌名称｜推广方案</h1><p>仅供版式参考；内容、价格和素材需按客户确认资料填写。</p></header><section><h2>项目背景与现状</h2><p>填写有材料支持的门店现状。</p></section><section><h2>策略与交付</h2><p>填写已确认的打法及交付范围。</p></section><section><h2>费用明细</h2><table><thead><tr><th>项目</th><th>数量</th><th>单价</th><th>金额</th></tr></thead><tbody><tr><td>待确认</td><td>—</td><td>—</td><td>—</td></tr></tbody></table></section><section><h2>配图参考</h2><p>使用获得授权且与交付类型对应的素材。</p></section></main></body></html>
